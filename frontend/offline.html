<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b6cff">
<title>SocialAuto — offline</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font:16px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:#f3f5f9;color:#1c2430;
    padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom);}
  .card{max-width:360px;text-align:center;background:#fff;border:1px solid #e3e7ee;border-radius:20px;padding:32px 24px;
    box-shadow:0 10px 28px rgba(16,24,40,.08)}
  .mk{width:64px;height:64px;border-radius:18px;margin:0 auto 14px;
    background:linear-gradient(135deg,#5b6cff,#8b5cf6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px}
  h1{font-size:22px;margin:0 0 8px}
  p{color:#7b8494;margin:0 0 18px}
  button{border:none;background:#5b6cff;color:#fff;font-weight:800;border-radius:12px;padding:12px 18px;font-size:15px}
</style>
</head>
<body>
  <div class="card">
    <div class="mk">⚡</div>
    <h1>You're offline</h1>
    <p>SocialAuto needs internet to load comments and publish. Reconnect and try again.</p>
    <button onclick="location.href='/'">Retry</button>
  </div>
</body>
</html>
